[project]
name = "legislation-scraper"
version = "0.1.0"
description = "Async web scraper for Brazilian federal and state legislation, with PDF/OCR extraction and structured data output."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.13.3",
    "aiohttp-socks>=0.11.0",
    "beautifulsoup4>=4.13.4",
    "html-to-markdown>=2.28.2",
    "loguru>=0.7.3",
    "lxml>=6.0",
    "pydantic-ai-slim[openai,bedrock,anthropic,google]>=2.63",
    "playwright>=1.58.0",
    "playwright-stealth>=2.0.2",
    "pymupdf>=1.27.1",
    # 1.x requires the unused layout/onnxruntime stack.
    "pymupdf4llm>=0.3.4,<1",
    "pyrate-limiter>=4.0.2",
    "python-dotenv>=1.1.1",
    "tenacity>=9.1.3",
    "unidecode>=1.4.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.15.7",
]

[tool.pyright]
include = ["src", "main.py"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.ruff]
target-version = "py314"
